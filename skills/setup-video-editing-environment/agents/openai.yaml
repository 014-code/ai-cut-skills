interface:
  display_name: "视频剪辑环境安装"
  short_description: "Windows 优先的跨平台视频剪辑依赖安装、诊断与环境验证"
  default_prompt: "使用 $setup-video-editing-environment 先发现并按能力验证已有环境；有合格候选就复用，全部不合格时再创建 ai-video-editing。Windows 安装前检查 venv/ensurepip/pip，优先使用完整现有或显式便携 FFmpeg，并直接复用 Skill 内置 Whisper tiny；最终必须生成 ok=true 的 video_environment.json。"
