interface:
  display_name: "汽水音乐混剪成片"
  short_description: "汽水音乐利益点语义选材、字幕对齐无缝切换与品牌安全区混剪"
  default_prompt: "使用 $edit-soda-music-video 完成汽水混剪。最高优先级：正式交付只能运行 soda_pipeline.py render，禁止新建 build_mix.py、自写 renderer 或直接 FFmpeg 绕过；环境、素材理解、Whisper、合规或 preflight 未完成时必须 blocked，不得降级草稿。先用 $setup-video-editing-environment 生成 ok=true 的 video_environment.json，再用 $manage-visual-asset-library 同步 Manifest、生成可恢复理解队列、Read 全部待处理素材并校验；Windows 视频必须显式声明 transparency_mode，embedded_alpha 用实际 FFmpeg 在 10%/50%/90% 抽样，失败禁止 colorkey/chromakey/Screen/blend 降级；动画按 mapped_start 重置 PTS，默认 once_hold_last，include_audio=true 时混入真实素材音轨而非合成提示音；用户未指定渠道和 BGM 时自主选择并记录依据；汽水层只在利益点选材并优先特殊规则；先计算一次任务级字幕字数上限，只插入语义换行，再对当前 input 执行 Whisper 词级识别，字幕和素材统一 time_mode=input；删除普通标点但保留数字小数点；素材默认保持源像素尺寸，仅在有效内容碰撞且平移无效时等比缩小。最终只有 delivery report 的 formal_delivery_ready=true 才能称为正式成片；单独 qa 永远只是 technical_media_only。"
