      ".DS_Store",
      ".cache",
      ".npm",
      ".ruff_cache",
      "__pycache__",
      "build",
      "coverage",
      "dist",
      "node_modules"
    ],
    "exclude_suffixes": [
      ".pyc",
      ".pyo"
    ]
  },
