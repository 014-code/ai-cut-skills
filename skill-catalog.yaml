{
  "schema_version": 1,
  "categories": {
    "runtime": {
      "label": "运行环境",
      "description": "发现、安装并验证视频生产所需的跨平台运行环境。"
    },
    "assets": {
      "label": "素材获取与治理",
      "description": "获取、筛选、审核、理解和管理可复用视觉素材。"
    },
    "render-components": {
      "label": "通用渲染组件",
      "description": "向上层工作流提供可复用的字幕和视觉动效渲染能力。"
    },
    "production": {
      "label": "业务成片工作流",
      "description": "根据具体业务、品牌和合规规则组织正式成片。"
    },
    "repurpose": {
      "label": "衍生加工",
      "description": "对已生成或已有视频执行裂变、组合与素材重混。"
    },
    "distribution": {
      "label": "分发自动化",
      "description": "将验收通过的视频上传、送审并回填运营数据。"
    }
  },
